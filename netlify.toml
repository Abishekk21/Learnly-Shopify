# Netlify Configuration for Learnly Shopify LMS Frontend

[build]
  # Directory with the package.json for the frontend
  base = "client/"
  
  # Build command
  command = "npm run build"
  
  # Output directory (where Vite puts the build files)
  publish = "dist/"

# Environment variables (set these in Netlify UI)
# VITE_API_URL = "https://your-backend-url.onrender.com"
# VITE_SHOPIFY_API_KEY = "your_shopify_api_key"
# VITE_SHOP_DOMAIN = "your-store.myshopify.com"

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers - Allow embedding in Shopify Admin
[[headers]]
  for = "/*"
  [headers.values]
    # Allow Shopify to embed this app in an iframe
    X-Frame-Options = "ALLOW-FROM https://*.myshopify.com"
    Content-Security-Policy = "frame-ancestors https://*.myshopify.com https://admin.shopify.com"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
